version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-auto-publisher
    restart: unless-stopped
    environment:
      # Настройте эти переменные в .env файле
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      - MAIN_CHAT_IDS=${MAIN_CHAT_IDS}
      - MAIN_FOOTER_TEXT=${MAIN_FOOTER_TEXT}
      - MAIN_HELP_LINK=${MAIN_HELP_LINK}
      - MAIN_ADDITIONAL_LINKS=${MAIN_ADDITIONAL_LINKS}
      - INCY_CHAT_IDS=${INCY_CHAT_IDS}
      - INCY_FOOTER_TEXT=${INCY_FOOTER_TEXT}
      - INCY_HELP_LINK=${INCY_HELP_LINK}
      - INCY_ADDITIONAL_LINKS=${INCY_ADDITIONAL_LINKS}
    volumes:
      # Сохраняем данные между перезапусками
      - ./data:/app/data
      - ./.env:/app/.env
    networks:
      - telegram-bot-network

networks:
  telegram-bot-network:
    driver: bridge
